<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>fightai dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8ec;
    --muted: #8b93a3; --accent: #4f8cff; --good: #3ecf8e; --bad: #ff5f6d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 20px; color: var(--muted); }
  h1 span { color: var(--text); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 980px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 14px; }
  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.off { background: var(--bad); }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .metric { background: #0f1115; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .metric .label { font-size: 11px; color: var(--muted); }
  .metric .value { font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input, select {
    width: 100%; padding: 8px 10px; background: #0f1115; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px;
  }
  button {
    margin-top: 14px; padding: 9px 14px; border-radius: 6px; border: none;
    background: var(--accent); color: white; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  button.danger { background: var(--bad); }
  button.secondary { background: #2a2f3a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button + button { margin-left: 8px; }
  .log { font-size: 11px; color: var(--muted); margin-top: 10px; word-break: break-all; }
  .full { grid-column: 1 / -1; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .metric-chip { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 12px; color: var(--muted); }
  .metric-chip input { width: auto; margin: 0; accent-color: var(--accent); }
  .metric-chip.active { color: var(--text); }
  canvas[id^="chart-"] { width: 100%; height: 220px; display: block; }
  .chart-empty { color: var(--muted); font-size: 12px; padding: 40px 0; text-align: center; }
  .pager { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .pager button { margin: 0; padding: 3px 9px; font-size: 12px; font-weight: 400; background: #2a2f3a; }
  .pager button:disabled { opacity: .35; cursor: not-allowed; }
  .pager .page-info { white-space: nowrap; }
</style>
</head>
<body>
  <h1>fightai <span>학습 대시보드</span></h1>
  <div class="grid">
    <div class="panel">
      <h2>학습 상태</h2>
      <div class="status-row"><div id="train-dot" class="dot"></div><strong id="train-state">확인 중...</strong></div>
      <div class="metrics">
        <div class="metric"><div class="label">total_timesteps</div><div class="value" id="m-steps">-</div></div>
        <div class="metric"><div class="label">ep_rew_mean</div><div class="value" id="m-rew">-</div></div>
        <div class="metric"><div class="label">b_ep_rew_mean</div><div class="value" id="m-brew">-</div></div>
        <div class="metric"><div class="label">ep_len_mean</div><div class="value" id="m-len">-</div></div>
        <div class="metric"><div class="label">fps</div><div class="value" id="m-fps">-</div></div>
      </div>
      <div class="log" id="log-file"></div>

      <label>timesteps</label>
      <input id="in-timesteps" type="number" value="2000000" step="100000">

      <label>resume from (셀프플레이는 필수)</label>
      <select id="in-resume"><option value="">-- 처음부터 새로 --</option></select>
      <div class="pager" id="pager-resume"></div>

      <label>output 이름</label>
      <input id="in-out" type="text" placeholder="예: ppo_dash_run">

      <label>학습 방식</label>
      <div style="display:flex; flex-direction:column; gap:6px; margin:4px 0 0;">
        <label style="display:flex; align-items:center; gap:8px; margin:0;">
          <input type="radio" name="train-mode" id="mode-scripted" value="scripted" checked style="width:auto;">
          <span style="margin:0;">스크립트 상대</span>
        </label>
        <label style="display:flex; align-items:center; gap:8px; margin:0;">
          <input type="radio" name="train-mode" id="mode-selfplay" value="selfplay" style="width:auto;">
          <span style="margin:0;">셀프플레이 (얼려진 상대 스냅샷, 주기적으로 갱신)</span>
        </label>
        <label style="display:flex; align-items:center; gap:8px; margin:0;">
          <input type="radio" name="train-mode" id="mode-paired" value="paired" style="width:auto;">
          <span style="margin:0;">paired 셀프플레이 (양쪽 다 같은 살아있는 정책, 얼려진 상대 없음)</span>
        </label>
      </div>

      <div id="selfplay-fields" style="display:none;">
        <label>refresh interval (스텝, 선택 -- 셀프플레이 전용)</label>
        <input id="in-refresh" type="number" value="250000" step="10000">
        <label>ent_coef 오버라이드 (선택, 예: 0.01)</label>
        <input id="in-entcoef" type="number" step="0.001" placeholder="비워두면 체크포인트 값 유지">
      </div>

      <div>
        <button id="btn-train-start">학습 시작</button>
        <button id="btn-train-stop" class="danger">중지</button>
      </div>
    </div>

    <div class="panel">
      <h2>뷰어 (격투 확인)</h2>
      <div class="status-row"><div id="watch-dot" class="dot"></div><strong id="watch-state">확인 중...</strong></div>

      <label>체크포인트 선택</label>
      <select id="in-watch-checkpoint"></select>
      <div class="pager" id="pager-watch"></div>

      <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
        <input id="in-watch-mirror" type="checkbox" checked style="width:auto;">
        <span style="margin:0;">미러 매치 (같은 체크포인트로 셀프플레이 대전)</span>
      </label>

      <div>
        <button id="btn-watch-latest">최신 스냅샷 보기</button>
        <button id="btn-watch-start" class="secondary">선택한 걸로 보기</button>
      </div>
      <div>
        <button id="btn-watch-stop" class="danger">뷰어 닫기</button>
        <button id="btn-refresh-ckpt" class="secondary">목록 새로고침</button>
      </div>
    </div>

    <div class="panel full">
      <h2>총 보상 추이 (a vs b)</h2>
      <div id="metric-picker-totals" class="legend" style="flex-wrap:wrap; gap:10px 16px;"></div>
      <canvas id="chart-totals"></canvas>
      <div id="chart-totals-empty" class="chart-empty" style="display:none;">아직 데이터 없음</div>
    </div>

    <div class="panel full">
      <h2>보상 항목별 breakdown</h2>
      <div id="metric-picker-breakdown" class="legend" style="flex-wrap:wrap; gap:10px 16px;"></div>
      <canvas id="chart-breakdown"></canvas>
      <div id="chart-breakdown-empty" class="chart-empty" style="display:none;">아직 데이터 없음</div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}

function fmt(n) {
  if (n === undefined || n === null) return '-';
  if (Math.abs(n) >= 1000) return Math.round(n).toLocaleString();
  return (Math.round(n * 100) / 100).toString();
}

async function refreshStatus() {
  const s = await api('/api/status');
  $('train-dot').className = 'dot ' + (s.training ? 'on' : 'off');
  $('train-state').textContent = s.training ? '학습 중' : '중지됨';
  $('watch-dot').className = 'dot ' + (s.watching ? 'on' : 'off');
  $('watch-state').textContent = s.watching ? '실행 중' : '중지됨';
  $('m-steps').textContent = fmt(s.metrics.total_timesteps);
  $('m-rew').textContent = fmt(s.metrics.ep_rew_mean);
  $('m-brew').textContent = fmt(s.metrics.b_ep_rew_mean);
  $('m-len').textContent = fmt(s.metrics.ep_len_mean);
  $('m-fps').textContent = fmt(s.metrics.fps);
  $('log-file').textContent = s.log_file ? ('log: ' + s.log_file) : '';
  $('btn-train-start').disabled = s.training;
  $('btn-train-stop').disabled = !s.training;
}

const CKPT_PAGE_SIZE = 20;
// independent pagination state per picker -- page 1 is always the newest checkpoints
// (backend sorts newest-first), so opening either picker lands on the latest by default
const ckptPickers = {
  resume: { page: 1, selectId: 'in-resume', pagerId: 'pager-resume', placeholder: '-- 처음부터 새로 --' },
  watch: { page: 1, selectId: 'in-watch-checkpoint', pagerId: 'pager-watch', placeholder: null },
};

async function loadCheckpointPage(picker) {
  const data = await api(`/api/checkpoints?page=${picker.page}&page_size=${CKPT_PAGE_SIZE}`);
  picker.page = data.page; // server clamps out-of-range pages, stay in sync
  const sel = $(picker.selectId);
  const prev = sel.value;
  sel.innerHTML = '';
  if (picker.placeholder) {
    const ph = document.createElement('option');
    ph.value = ''; ph.textContent = picker.placeholder;
    sel.appendChild(ph);
  }
  for (const c of data.checkpoints) {
    const o = document.createElement('option');
    o.value = c.path; o.textContent = c.label;
    sel.appendChild(o);
  }
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;

  const pager = $(picker.pagerId);
  pager.innerHTML = '';
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '◀ 이전';
  prevBtn.type = 'button';
  prevBtn.disabled = picker.page <= 1;
  prevBtn.onclick = () => { picker.page -= 1; loadCheckpointPage(picker); };
  const nextBtn = document.createElement('button');
  nextBtn.textContent = '다음 ▶';
  nextBtn.type = 'button';
  nextBtn.disabled = picker.page >= data.total_pages;
  nextBtn.onclick = () => { picker.page += 1; loadCheckpointPage(picker); };
  const info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = `${data.page}/${data.total_pages}페이지 (최신순, 전체 ${data.total}개)`;
  pager.append(prevBtn, info, nextBtn);
}

function refreshCheckpoints() {
  return Promise.all(Object.values(ckptPickers).map(loadCheckpointPage));
}

function trainMode() {
  return document.querySelector('input[name="train-mode"]:checked').value;
}

document.querySelectorAll('input[name="train-mode"]').forEach(el => el.addEventListener('change', () => {
  $('selfplay-fields').style.display = trainMode() === 'scripted' ? 'none' : 'block';
  $('in-refresh').closest('label') && ($('in-refresh').style.display = trainMode() === 'paired' ? 'none' : '');
  $('in-refresh').previousElementSibling.style.display = trainMode() === 'paired' ? 'none' : '';
}));

$('btn-train-start').addEventListener('click', async () => {
  const mode = trainMode();
  const selfplay = mode === 'selfplay';
  const paired = mode === 'paired';
  if ((selfplay || paired) && !$('in-resume').value) return alert('셀프플레이/paired는 resume from 체크포인트가 필요해요');
  const body = {
    timesteps: parseInt($('in-timesteps').value, 10),
    resume_from: $('in-resume').value || null,
    out: $('in-out').value || undefined,
    selfplay,
    paired,
    refresh_interval: selfplay ? parseInt($('in-refresh').value, 10) : undefined,
    ent_coef: (selfplay || paired) && $('in-entcoef').value ? parseFloat($('in-entcoef').value) : undefined,
  };
  const r = await api('/api/train/start', { method: 'POST', body: JSON.stringify(body) });
  if (r.error) alert(r.error);
  refreshStatus();
});

$('btn-train-stop').addEventListener('click', async () => {
  if (!confirm('학습을 중지할까요? (마지막 autosave 체크포인트부터 이어할 수 있습니다)')) return;
  await api('/api/train/stop', { method: 'POST' });
  refreshStatus();
});

async function startWatch(checkpoint) {
  const mirror = $('in-watch-mirror').checked;
  const r = await api('/api/watch/start', { method: 'POST', body: JSON.stringify({ checkpoint, mirror }) });
  if (r.error) alert(r.error);
  refreshStatus();
}

$('btn-watch-start').addEventListener('click', () => {
  const checkpoint = $('in-watch-checkpoint').value;
  if (!checkpoint) return alert('체크포인트를 선택하세요');
  startWatch(checkpoint);
});

$('btn-watch-latest').addEventListener('click', () => startWatch('__latest__'));

$('btn-watch-stop').addEventListener('click', async () => {
  await api('/api/watch/stop', { method: 'POST' });
  refreshStatus();
});

$('btn-refresh-ckpt').addEventListener('click', refreshCheckpoints);

function resizeCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(rect.width, 100), h = 220;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function drawLine(ctx, pts, xKey, yKey, xMin, xMax, yMin, yMax, w, h, pad, color) {
  const usable = pts.filter(p => p[yKey] !== undefined);
  if (usable.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  usable.forEach((p, i) => {
    const x = pad + (p[xKey] - xMin) / (xMax - xMin || 1) * (w - pad * 2);
    const y = h - pad - (p[yKey] - yMin) / (yMax - yMin || 1) * (h - pad * 2);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
}

const METRIC_COLORS = {
  ep_rew_mean: '#4f8cff', b_ep_rew_mean: '#ffb454', ep_len_mean: '#8b93a3',
  r_strike: '#3ecf8e', r_effort: '#ff5f6d', r_jerk: '#c792ea',
  r_engage: '#5fd3f3', r_down: '#f78c6c', r_knockdown_entry: '#ffd166',
  r_balance: '#ef9fbc', r_ground: '#7fd88f', r_knee: '#e08a4f', r_terminal: '#9aa5b1',
};
const TOTALS_METRICS = ['ep_rew_mean', 'b_ep_rew_mean', 'ep_len_mean'];
const BREAKDOWN_METRICS = ['r_strike', 'r_effort', 'r_jerk', 'r_engage', 'r_down', 'r_knockdown_entry', 'r_balance', 'r_ground', 'r_knee', 'r_terminal'];

// two independent chart instances: 'totals' (ep_rew_mean vs b_ep_rew_mean) and
// 'breakdown' (the reward_breakdown terms) -- kept on separate axes since their
// scales don't compare (e.g. r_engage ~-50 would swamp r_effort ~-15 on one chart)
const charts = {
  totals: { metrics: TOTALS_METRICS, active: new Set(['ep_rew_mean', 'b_ep_rew_mean']), built: false },
  breakdown: { metrics: BREAKDOWN_METRICS, active: new Set(BREAKDOWN_METRICS), built: false },
};
let lastPoints = [];

function buildMetricPicker(name) {
  const chart = charts[name];
  const el = $(`metric-picker-${name}`);
  el.innerHTML = '';
  chart.metrics.forEach(key => {
    const label = document.createElement('label');
    label.className = 'metric-chip' + (chart.active.has(key) ? ' active' : '');
    const color = METRIC_COLORS[key] || '#8b93a3';
    const hint = ALWAYS_NEGATIVE_KEYS.has(key) ? ' (비용, 낮을수록 좋음)' : '';
    label.innerHTML = `<input type="checkbox" ${chart.active.has(key) ? 'checked' : ''}>
      <span class="swatch" style="background:${color}"></span>${key}${hint}`;
    label.querySelector('input').addEventListener('change', (e) => {
      e.target.checked ? chart.active.add(key) : chart.active.delete(key);
      label.classList.toggle('active', e.target.checked);
      drawChart(name, lastPoints);
    });
    el.appendChild(label);
  });
  chart.built = true;
}

// these three are pure costs (Sum(action^2), Sum(delta-action^2), log1p(distance) --
// all structurally >= 0 before their reward-side minus sign), so they can never be
// positive as reward contributions. Flipped to positive "cost incurred" for display
// only -- the actual training reward keeps its real sign, this doesn't touch that.
const ALWAYS_NEGATIVE_KEYS = new Set(['r_effort', 'r_jerk', 'r_engage']);

function drawChart(name, points) {
  const series = [...charts[name].active];
  const canvas = $(`chart-${name}`);
  const empty = $(`chart-${name}-empty`);
  const hasData = points && points.length >= 2 && series.some(k => points.some(p => p[k] !== undefined));
  if (!hasData) {
    canvas.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  canvas.style.display = 'block';
  empty.style.display = 'none';

  const { ctx, w, h } = resizeCanvas(canvas);
  ctx.clearRect(0, 0, w, h);
  const pad = 34;

  points = points.map(p => {
    const q = { ...p };
    ALWAYS_NEGATIVE_KEYS.forEach(k => { if (q[k] !== undefined) q[k] = -q[k]; });
    return q;
  });

  const xs = points.map(p => p.total_timesteps);
  const ys = [];
  points.forEach(p => series.forEach(k => { if (p[k] !== undefined) ys.push(p[k]); }));
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);

  ctx.strokeStyle = '#2a2f3a';
  ctx.fillStyle = '#8b93a3';
  ctx.font = '10px -apple-system, sans-serif';
  ctx.lineWidth = 1;
  const rows = 4;
  for (let i = 0; i <= rows; i++) {
    const y = pad + (h - pad * 2) * (i / rows);
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - 8, y); ctx.stroke();
    const val = yMax - (yMax - yMin) * (i / rows);
    ctx.fillText(Math.round(val).toLocaleString(), 4, y + 3);
  }
  ctx.fillText(xMin.toLocaleString(), pad, h - 6);
  const xMaxLabel = xMax.toLocaleString();
  ctx.fillText(xMaxLabel, w - 8 - ctx.measureText(xMaxLabel).width, h - 6);

  series.forEach(key => {
    drawLine(ctx, points, 'total_timesteps', key, xMin, xMax, yMin, yMax, w, h, pad, METRIC_COLORS[key] || '#8b93a3');
  });
}

async function refreshHistory() {
  const { points } = await api('/api/history');
  lastPoints = points || [];
  Object.keys(charts).forEach(name => {
    if (!charts[name].built) buildMetricPicker(name);
    drawChart(name, lastPoints);
  });
}

refreshStatus();
refreshCheckpoints();
refreshHistory();
setInterval(refreshStatus, 2000);
setInterval(refreshCheckpoints, 10000);
setInterval(refreshHistory, 5000);
window.addEventListener('resize', () => Object.keys(charts).forEach(name => drawChart(name, lastPoints)));
</script>
</body>
</html>
